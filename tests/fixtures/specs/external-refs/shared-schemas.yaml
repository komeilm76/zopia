User:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: integer
      format: int64
    name:
      $ref: '#/common/DisplayName'
    address:
      $ref: 'common.json#/definitions/Address'
    tags:
      $ref: '#/common/TagList'
UserUpdate:
  type: object
  properties:
    name:
      $ref: '#/common/DisplayName'
common:
  DisplayName:
    type: string
    minLength: 1
    maxLength: 200
  TagList:
    type: array
    items:
      type: string
